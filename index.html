<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دونات الفيروز | Fayrouz Donuts</title>
    <!-- استيراد خط عربي أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-chocolate: #1c0f05;
            --card-chocolate: #2b1704;
            --accent-gold: #d4af37;
            --accent-gold-light: #f3e5ab;
            --accent-teal: #00a896;
            --accent-teal-dark: #028090;
            --text-light: #fdfbf7;
            --text-muted: #c5b39c;
            --danger: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-chocolate);
            color: var(--text-light);
            padding-bottom: 90px; /* مساحة للشريط السفلي */
        }

        /* الهيدر العلوي */
        header {
            background: linear-gradient(135deg, #120902, var(--card-chocolate));
            border-bottom: 2px solid var(--accent-gold);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area i {
            color: var(--accent-teal);
            font-size: 28px;
        }

        .logo-area h1 {
            font-size: 22px;
            color: var(--accent-gold);
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .header-icons {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }

        .icon-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-chocolate);
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }

        /* قسم الترحيب */
        .hero-banner {
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(circle, rgba(43,23,4,1) 0%, rgba(28,15,5,1) 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .hero-banner h2 {
            font-size: 28px;
            color: var(--accent-gold-light);
            margin-bottom: 10px;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* حاوية المنتجات */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 20px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-teal);
            padding-right: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-chocolate);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
            border-color: var(--accent-gold);
        }

        .product-img-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #361e08;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-teal);
            color: white;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px 15px 15px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .add-to-cart-btn {
            background: linear-gradient(135deg, var(--accent-teal), var(--accent-teal-dark));
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }

        .add-to-cart-btn:active {
            transform: scale(0.95);
        }

        /* نافذة السلة (Modal / Drawer) */
        .drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--card-chocolate);
            z-index: 2000;
            box-shadow: -5px 0 30px rgba(0,0,0,0.8);
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
            border-left: 2px solid var(--accent-gold);
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            padding: 20px;
            background: var(--bg-chocolate);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        .drawer-header h3 {
            color: var(--accent-gold);
            font-size: 18px;
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .drawer-body {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(212,175,55,0.1);
        }

        .cart-item-info h4 {
            font-size: 14px;
            color: var(--text-light);
        }

        .cart-item-info p {
            font-size: 12px;
            color: var(--accent-gold);
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: var(--accent-gold);
            color: var(--bg-chocolate);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .drawer-footer {
            padding: 20px;
            background: var(--bg-chocolate);
            border-top: 1px solid rgba(212,175,55,0.2);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-teal);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: var(--accent-teal-dark);
        }

        /* نافذة الحساب والطلبات */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-chocolate);
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            border: 2px solid var(--accent-gold);
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-content h3 {
            color: var(--accent-gold);
            margin-bottom: 15px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: var(--bg-chocolate);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: var(--accent-teal);
            outline: none;
        }

        .save-btn {
            background: var(--accent-gold);
            color: var(--bg-chocolate);
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* شريط التنقل السفلي الثابت للموبايل */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-chocolate);
            border-top: 1px solid var(--accent-gold);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--accent-gold);
        }

        .order-card-history {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(212,175,55,0.2);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .order-card-history h5 {
            color: var(--accent-gold);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .order-card-history p {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-cookie-bite"></i>
            <h1>دونات الفيروز</h1>
        </div>
        <div class="header-icons">
            <div class="icon-btn" onclick="openModal('accountModal')">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="icon-btn" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="cartBadge">0</span>
            </div>
        </div>
    </header>

    <!-- البانر -->
    <div class="hero-banner">
        <h2>ألذ وأشهى أنواع الدونات الفاخرة</h2>
        <p>مصنوعة طازجة يومياً بأجود أنواع الشوكولاتة والبلدان العالمية</p>
    </div>

    <!-- قائمة المنتجات (20 صنفاً) -->
    <div class="container">
        <h3 class="section-title">قائمة الأصناف (20 صنفاً مميزاً)</h3>
        <div class="products-grid" id="productsGrid">
            <!-- سيتم تعبئة الأصناف عبر JavaScript -->
        </div>
    </div>

    <!-- سلة التسوق الجانبية (Drawer) -->
    <div class="drawer" id="cartDrawer">
        <div class="drawer-header">
            <h3>سلة المشتريات</h3>
            <button class="close-drawer" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-body" id="cartItemsContainer">
            <p style="text-align: center; color: var(--text-muted); margin-top: 40px;">السلة فارغة حالياً</p>
        </div>
        <div class="drawer-footer">
            <div class="total-row">
                <span>الإجمالي:</span>
                <span id="cartTotalPrice">0 ج.م</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">إتمام الطلب عبر الواتساب <i class="fa-brands fa-whatsapp"></i></button>
        </div>
    </div>

    <!-- نافذة الحساب الشخصي -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>حسابي الشخصي وبيانات التوصيل</h3>
                <button class="close-drawer" onclick="closeModal('accountModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="form-group">
                <label>الاسم بالكامل</label>
                <input type="text" id="userName" placeholder="أدخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label>رقم الهاتف (للتواصل)</label>
                <input type="tel" id="userPhone" placeholder="01xxxxxxxxx">
            </div>
            <div class="form-group">
                <label>عنوان التوصيل بالتفصيل</label>
                <textarea id="userAddress" rows="3" placeholder="المنطقة، الشارع، رقم الحلاقة أو المنزل"></textarea>
            </div>
            <button class="save-btn" onclick="saveUserData()">حفظ البيانات</button>
        </div>
    </div>

    <!-- نافذة طلباتي السابقة -->
    <div class="modal-overlay" id="ordersModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>سجل طلباتي السابقة</h3>
                <button class="close-drawer" onclick="closeModal('ordersModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="ordersHistoryContainer">
                <p style="text-align: center; color: var(--text-muted);">لا توجد طلبات سابقة حتى الآن.</p>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي الثابت -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="toggleCart()">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>السلة</span>
        </button>
        <button class="nav-item" onclick="openModal('ordersModal')">
            <i class="fa-solid fa-receipt"></i>
            <span>طلباتي</span>
        </button>
        <button class="nav-item" onclick="openModal('accountModal')">
            <i class="fa-solid fa-user-gear"></i>
            <span>حسابي</span>
        </button>
    </nav>
