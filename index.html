<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دونات الفيروز | Fayrouz Donuts</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #140a04;
            --card: #231206;
            --gold: #d4af37;
            --teal: #00a896;
            --text: #fff8f0;
            --text-sub: #b8a28d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        header {
            background: #0d0602;
            border-bottom: 2px solid var(--gold);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 18px; color: var(--gold); font-weight: 900; }
        .cart-icon-head {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .hero { text-align: center; padding: 20px 15px; background: var(--card); border-bottom: 1px solid rgba(212,175,55,0.2); }
        .hero h2 { font-size: 20px; color: var(--gold); }
        .hero p { font-size: 12px; color: var(--text-sub); }

        .container { padding: 15px; max-width: 1000px; margin: 0 auto; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; }
        .title { font-size: 13px; font-weight: bold; margin: 6px 0 2px; }
        .desc { font-size: 10px; color: var(--text-sub); margin-bottom: 8px; height: 28px; overflow: hidden; }
        .price { font-size: 14px; font-weight: 900; color: var(--gold); }
        
        .btn-add {
            background: var(--teal);
            color: white;
            border: none;
            padding: 6px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-add:active { transform: scale(0.96); }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--teal);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            z-index: 2000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Modal & Drawer */
        .drawer {
            position: fixed;
            top: 0; right: -100%;
            width: 100%; max-width: 350px; height: 100%;
            background: var(--card);
            z-index: 1000;
            transition: 0.3s ease;
            display: flex; flex-direction: column;
            border-left: 2px solid var(--gold);
        }
        .drawer.open { right: 0; }

        .d-head { padding: 15px; background: #0d0602; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .d-body { padding: 15px; flex-grow: 1; overflow-y: auto; }
        .d-foot { padding: 15px; background: #0d0602; border-top: 1px solid rgba(212,175,55,0.2); }

        .item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1500;
            display: none; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-box { background: var(--card); border: 1px solid var(--gold); border-radius: 10px; padding: 20px; width: 100%; max-width: 350px; }

        .inp { width: 100%; background: #0d0602; border: 1px solid rgba(212,175,55,0.3); padding: 8px; border-radius: 6px; color: white; margin: 4px 0 10px; font-size: 12px; }

        .nav-bottom {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--card); border-top: 1px solid var(--gold);
            display: flex; justify-content: space-around; padding: 8px 0; z-index: 90;
        }
        .nav-btn { background: none; border: none; color: var(--text-sub); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-btn.active { color: var(--gold); }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍩 دونات الفيروز</div>
        <button class="cart-icon-head" onclick="toggleCart(true)">🛒 السلة (<span id="cnt">0</span>)</button>
    </header>

    <div class="hero">
        <h2>أشهى أنواع الدونات الطازجة</h2>
        <p>اختر أصنافك المفضلة وسجل طلبك بسهولة</p>
    </div>

    <div class="container">
        <div class="grid" id="grid"></div>
    </div>

    <!-- التنبيه عند الإضافة -->
    <div class="toast" id="toast">✓ تمت الإضافة للسلة بنجاح</div>

    <!-- السلة الجانبية -->
    <div class="drawer" id="drawer">
        <div class="d-head">
            <h3 style="color:var(--gold)">سلة المشتريات</h3>
            <button onclick="toggleCart(false)" style="background:none; border:none; color:white; font-size:16px; cursor:pointer;">✕</button>
        </div>
        <div class="d-body" id="cartList"></div>
        <div class="d-foot">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; color:var(--gold); font-weight:bold;">
                <span>الإجمالي:</span>
                <span id="tot">0 ج.م</span>
            </div>
            <button onclick="checkout()" style="width:100%; background:var(--teal); color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">تأكيد الطلب عبر الواتساب 📱</button>
        </div>
    </div>

    <!-- نافذة حسابي -->
    <div class="modal" id="accModal">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <h3 style="color:var(--gold); font-size:15px;">تسجيل البيانات للتوصيل</h3>
                <button onclick="closeAcc()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
            </div>
            <label style="font-size:11px;">الاسم بالكامل</label>
            <input type="text" id="uName" class="inp" placeholder="أدخل اسمك">
            <label style="font-size:11px;">رقم الهاتف</label>
            <input type="tel" id="uPhone" class="inp" placeholder="01xxxxxxxxx">
            <label style="font-size:11px;">العنوان بالتفصيل</label>
            <input type="text" id="uAddr" class="inp" placeholder="المنطقة والشارع">
            <button onclick="saveAcc()" style="width:100%; background:var(--gold); color:#000; border:none; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer;">حفظ البيانات</button>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <nav class="nav-bottom">
        <button class="nav-btn active" onclick="window.scrollTo({top:0, behavior:'smooth'})">🏠 الرئيسية</button>
        <button class="nav-btn" onclick="toggleCart(true)">🛒 السلة</button>
        <button class="nav-btn" onclick="openAcc()">👤 حسابي</button>
    </nav>

    <script>
        const items = [
            { id: 1, name: "دونات شوكولاتة داكنة", price: 35, desc: "شوكولاتة بلجيكية فاخرة", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=200" },
            { id: 2, name: "دونات الكراميل المملح", price: 38, desc: "كريمة وكراميل مميز", img: "https://images.unsplash.com/photo-1621236378699-8599fac6e1d7?w=200" },
            { id: 3, name: "دونات القرفة السكرية", price: 25, desc: "قرفة وسكر دافئ", img: "https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?w=200" },
            { id: 4, name: "دونات الفستق الحلبي", price: 45, desc: "فستق وشوكولاتة بيضاء", img: "https://images.unsplash.com/photo-1533750349077-cd97ef2b013b?w=200" },
            { id: 5, name: "دونات اللوتس المقرمش", price: 42, desc: "زبدة وبسكويت لوتس", img: "https://images.unsplash.com/photo-1612204052044-06c5740449da?w=200" },
            { id: 6, name: "دونات الفيروز الخاصة", price: 40, desc: "توقيع المحل الفيروزي", img: "https://images.unsplash.com/photo-1514517521153-1be72277b32f?w=200" },
            { id: 7, name: "دونات النوتيلا والبندق", price: 45, desc: "نوتيلا وبندق محمص", img: "https://images.unsplash.com/photo-1626803775151-61d756612f97?w=200" },
            { id: 8, name: "دونات الفراولة الطازجة", price: 35, desc: "صقيع فراولة طبيعي", img: "https://images.unsplash.com/photo-1582293041000-4299b95155a0?w=200" },
            { id: 9, name: "دونات الأوريو والكوكيز", price: 38, desc: "قطع أوريو وبسكويت", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=200" },
            { id: 10, name: "دونات المارشملو الذائب", price: 36, desc: "مارشملو مخبوز", img: "https://images.unsplash.com/photo-1579372786545-d24232daf58c?w=200" },
            { id: 11, name: "دونات التوت والليمون", price: 37, desc: "توت بري منعش", img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?w=200" },
            { id: 12, name: "دونات المانجو الاستوائية", price: 39, desc: "صقيع مانجو غني", img: "https://images.unsplash.com/photo-1609501676729-79ad4538805f?w=200" },
            { id: 13, name: "دونات جوز الهند الذهبي", price: 34, desc: "جوز هند وحليب مكثف", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=200" },
            { id: 14, name: "دونات الشوكولاتة المزدوجة", price: 40, desc: "عجين وصقيع شوكولاتة", img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=200" },
            { id: 15, name: "دونات العسل الطبيعي", price: 30, desc: "عسل نحل صافي", img: "https://images.unsplash.com/photo-1587314168485-3236d6710814?w=200" },
            { id: 16, name: "دونات تشيز كيك الفراولة", price: 44, desc: "جبن كريمي وفراولة", img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=200" },
            { id: 17, name: "دونات الكراميل والمكسرات", price: 46, desc: "لوز محمص وكراميل", img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=200" },
            { id: 18, name: "دونات التيراميسو الإيطالية", price: 45, desc: "قهوة وكاكاو بلجيكي", img: "https://images.unsplash.com/photo-1504473307692-95f00fc261bc?w=200" },
            { id: 19, name: "دونات الماتشا اليابانية", price: 42, desc: "ماتشا وشوكولاتة بيضاء", img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=200" },
            { id: 20, name: "دونات الفيروز الملكية", price: 50, desc: "خلطة فاخرة مع اللؤلؤ الذهبي", img: "https://images.unsplash.com/photo-1525059696034-4967a8e1dca2?w=200" }
        ];

        let cart = [];

        function render() {
            const g = document.getElementById('grid');
            g.innerHTML = items.map(i => `
                <div class="card">
                    <img src="${i.img}">
                    <div class="title">${i.name}</div>
                    <div class="desc">${i.desc}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="price">${i.price} ج.م</span>
                    </div>
                    <button class="btn-add" onclick="add(${i.id})">+ إضافة للسلة</button>
                </div>
            `).join('');
        }

        function add(id) {
            const itm = items.find(x => x.id === id);
            const inCart = cart.find(x => x.id === id);
            if(inCart) inCart.qty++;
            else cart.push({...itm, qty: 1});
            
            update();
            showToast();
            // تم إلغاء فتح السلة التلقائي هنا بناءً على طلبك
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 1500);
        }

        function update() {
            document.getElementById('cnt').innerText = cart.reduce((s, i) => s + i.qty, 0);
            const cl = document.getElementById('cartList');
            if(cart.length === 0) {
                cl.innerHTML = `<p style="text-align:center; color:var(--text-sub); margin-top:30px;">السلة فارغة حالياً</p>`;
                document.getElementById('tot').innerText = "0 ج.م";
                return;
            }
            let total = 0;
            cl.innerHTML = cart.map(i => {
                total += i.price * i.qty;
                return `
                    <div class="item-row">
                        <div>
                            <div style="font-weight:bold;">${i.name}</div>
                            <div style="color:var(--gold); font-size:11px;">${i.price} ج.م × ${i.qty}</div>
                        </div>
                        <div>
                            <button onclick="chg(${i.id}, -1)" style="padding:2px 6px;">-</button>
                            <span style="margin:0 4px;">${i.qty}</span>
                            <button onclick="chg(${i.id}, 1)" style="padding:2px 6px;">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('tot').innerText = total + " ج.م";
        }

        function chg(id, d) {
            const itm = cart.find(x => x.id === id);
            if(itm) {
                itm.qty += d;
                if(itm.qty <= 0) cart = cart.filter(x => x.id !== id);
            }
            update();
        }

        function toggleCart(open) {
            const d = document.getElementById('drawer');
            if(open) d.classList.add('open');
            else d.classList.remove('open');
        }

        function openAcc() {
            document.getElementById('accModal').style.display = 'flex';
            const u = JSON.parse(localStorage.getItem('u') || '{}');
            if(u.n) document.getElementById('uName').value = u.n;
            if(u.p) document.getElementById('uPhone').value = u.p;
            if(u.a) document.getElementById('uAddr').value = u.a;
        }

        function closeAcc() { document.getElementById('accModal').style.display = 'none'; }

        function saveAcc() {
            const n = document.getElementById('uName').value;
            const p = document.getElementById('uPhone').value;
            const a = document.getElementById('uAddr').value;
            if(!n || !p) return alert('يرجى كتابة الاسم ورقم الهاتف');
            localStorage.setItem('u', JSON.stringify({n, p, a}));
            alert('تم حفظ البيانات بنجاح!');
            closeAcc();
        }

        function checkout() {
            if(cart.length === 0) return alert('السلة فارغة!');
            const u = JSON.parse(localStorage.getItem('u') || '{}');
            if(!u.n) {
                alert('ادخل اسمك ورقم هاتفك في قسم "حسابي" أولاً لتوصيل الطلب.');
                openAcc();
                return;
            }
            let msg = `*طلب جديد - دونات الفيروز* 🍩\nالاسم: ${u.n}\nالهاتف: ${u.p}\nالعنوان: ${u.a}\n---\n`;
            let total = 0;
            cart.forEach(i => {
                msg += `- ${i.name} (${i.qty}) = ${i.price * i.qty} ج.م\n`;
                total += i.price * i.qty;
            });
            msg += `\nالإجمالي: ${total} ج.م`;
            window.open(`https://wa.me/201000000000?text=${encodeURIComponent(msg)}`, '_blank');
        }

        render();
    </script>
</body>
</html>
