<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دونات الفيروز | Fayrouz Donuts</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-chocolate: #1c0f05;
            --card-chocolate: #2b1704;
            --accent-gold: #d4af37;
            --accent-gold-light: #f3e5ab;
            --accent-teal: #00a896;
            --accent-teal-dark: #028090;
            --text-light: #fdfbf7;
            --text-muted: #c5b39c;
            --danger: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-chocolate);
            color: var(--text-light);
            padding-bottom: 90px;
        }

        header {
            background: #120902;
            border-bottom: 2px solid var(--accent-gold);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1 {
            font-size: 20px;
            color: var(--accent-gold);
            font-weight: 900;
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            font-size: 13px;
            font-weight: bold;
        }

        .badge {
            background: var(--danger);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 50%;
            margin-right: 4px;
        }

        .hero-banner {
            text-align: center;
            padding: 30px 15px;
            background: var(--card-chocolate);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .hero-banner h2 {
            font-size: 24px;
            color: var(--accent-gold-light);
            margin-bottom: 8px;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 18px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-teal);
            padding-right: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: var(--card-chocolate);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img-container {
            position: relative;
            width: 100%;
            height: 160px;
            background: #361e08;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .product-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px 12px 12px;
        }

        .product-price {
            font-size: 16px;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .add-to-cart-btn {
            background: var(--accent-teal);
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        /* Nav & Modals */
        .drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: var(--card-chocolate);
            z-index: 2000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            border-left: 2px solid var(--accent-gold);
        }

        .drawer.open { right: 0; }

        .drawer-header {
            padding: 15px;
            background: var(--bg-chocolate);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        .drawer-body {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .drawer-footer {
            padding: 15px;
            background: var(--bg-chocolate);
            border-top: 1px solid rgba(212,175,55,0.2);
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-teal);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-chocolate);
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            border: 2px solid var(--accent-gold);
            padding: 20px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input, .form-group textarea {
            width: 100%;
            background: var(--bg-chocolate);
            border: 1px solid rgba(212,175,55,0.3);
            padding: 8px;
            border-radius: 6px;
            color: white;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            background: var(--card-chocolate);
            border-top: 1px solid var(--accent-gold);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent-gold); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>🍩 دونات الفيروز</h1>
        </div>
        <div class="header-icons">
            <button class="icon-btn" onclick="openModal('accountModal')">👤 حسابي</button>
            <button class="icon-btn" onclick="toggleCart()">🛒 السلة <span class="badge" id="cartBadge">0</span></button>
        </div>
    </header>

    <div class="hero-banner">
        <h2>ألذ وأشهى أنواع الدونات الفاخرة</h2>
        <p>مصنوعة طازجة يومياً بأجود أنواع الشوكولاتة</p>
    </div>

    <div class="container">
        <h3 class="section-title">قائمة الأصناف (20 صنفاً مميزاً)</h3>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- السلة -->
    <div class="drawer" id="cartDrawer">
        <div class="drawer-header">
            <h3 style="color:var(--accent-gold)">سلة المشتريات</h3>
            <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="drawer-body" id="cartItemsContainer">
            <p style="text-align: center; color: var(--text-muted); margin-top: 30px;">السلة فارغة حالياً</p>
        </div>
        <div class="drawer-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; color:var(--accent-gold); font-weight:bold;">
                <span>الإجمالي:</span>
                <span id="cartTotalPrice">0 ج.م</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">تأكيد الطلب عبر الواتساب 📱</button>
        </div>
    </div>

    <!-- نافذة الحساب -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="color:var(--accent-gold)">حسابي وبيانات التوصيل</h3>
                <button onclick="closeModal('accountModal')" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
            </div>
            <div class="form-group">
                <label>الاسم بالكامل</label>
                <input type="text" id="userName" placeholder="أدخل اسمك">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="userPhone" placeholder="01xxxxxxxxx">
            </div>
            <div class="form-group">
                <label>العنوان بالتفصيل</label>
                <textarea id="userAddress" rows="2" placeholder="المنطقة والشارع"></textarea>
            </div>
            <button onclick="saveUserData()" style="width:100%; background:var(--accent-gold); border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">حفظ البيانات</button>
        </div>
    </div>

    <!-- نافذة طلباتي -->
    <div class="modal-overlay" id="ordersModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="color:var(--accent-gold)">سجل طلباتي السابقة</h3>
                <button onclick="closeModal('ordersModal')" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
            </div>
            <div id="ordersHistoryContainer">
                <p style="text-align: center; color: var(--text-muted);">لا توجد طلبات سابقة.</p>
            </div>
        </div>
    </div>

    <!-- شريط السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">🏠 الرئيسية</button>
        <button class="nav-item" onclick="toggleCart()">🛒 السلة</button>
        <button class="nav-item" onclick="openModal('ordersModal')">📜 طلباتي</button>
        <button class="nav-item" onclick="openModal('accountModal')">👤 حسابي</button>
    </nav>

    <script>
        const products = [
            { id: 1, name: "دونات شوكولاتة داكنة", price: 35, desc: "مغلفة بالشوكولاتة البلجيكية.", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300" },
            { id: 2, name: "دونات الكراميل المملح", price: 38, desc: "محشوة بالكريمة والكراميل.", img: "https://images.unsplash.com/photo-1621236378699-8599fac6e1d7?w=300" },
            { id: 3, name: "دونات القرفة السكرية", price: 25, desc: "مقرمشة ومغطاة بسكر القرفة.", img: "https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?w=300" },
            { id: 4, name: "دونات الفستق الحلبي", price: 45, desc: "بشوكولاتة بيضاء وفستق.", img: "https://images.unsplash.com/photo-1533750349077-cd97ef2b013b?w=300" },
            { id: 5, name: "دونات اللوتس المقرمش", price: 42, desc: "بزبدة وبسكويت اللوتس.", img: "https://images.unsplash.com/photo-1612204052044-06c5740449da?w=300" },
            { id: 6, name: "دونات الفيروز الخاصة", price: 40, desc: "شوكولاتة بيضاء باللون الفيروزي.", img: "https://images.unsplash.com/photo-1514517521153-1be72277b32f?w=300" },
            { id: 7, name: "دونات النوتيلا والبندق", price: 45, desc: "محشوة نوتيلا وبندق محمص.", img: "https://images.unsplash.com/photo-1626803775151-61d756612f97?w=300" },
            { id: 8, name: "دونات الفراولة الطازجة", price: 35, desc: "بصقيع الفراولة الوردي.", img: "https://images.unsplash.com/photo-1582293041000-4299b95155a0?w=300" },
            { id: 9, name: "دونات الأوريو والكوكيز", price: 38, desc: "قطع أوريو وبسكويت شوكولاتة.", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300" },
            { id: 10, name: "دونات المارشملو الذائب", price: 36, desc: "مارشملو مخبوز وشوكولاتة.", img: "https://images.unsplash.com/photo-1579372786545-d24232daf58c?w=300" },
            { id: 11, name: "دونات التوت والليمون", price: 37, desc: "نكهة التوت البري المنعشة.", img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?w=300" },
            { id: 12, name: "دونات المانجو الاستوائية", price: 39, desc: "صقيع المانجو الطبيعي.", img: "https://images.unsplash.com/photo-1609501676729-79ad4538805f?w=300" },
            { id: 13, name: "دونات جوز الهند الذهبي", price: 34, desc: "رقائق جوز هند وحليب مكثف.", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" },
            { id: 14, name: "دونات الشوكولاتة المزدوجة", price: 40, desc: "عجين وصقيع شوكولاتة.", img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300" },
            { id: 15, name: "دونات العسل الطبيعي", price: 30, desc: "بعسل النحل الصافي.", img: "https://images.unsplash.com/photo-1587314168485-3236d6710814?w=300" },
            { id: 16, name: "دونات تشيز كيك الفراولة", price: 44, desc: "جبن كريمي وفراولة.", img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=300" },
            { id: 17, name: "دونات الكراميل والمكسرات", price: 46, desc: "لوز محمص وكراميل.", img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=300" },
            { id: 18, name: "دونات التيراميسو", price: 45, desc: "بنكهة القهوة والكاكاو.", img: "https://images.unsplash.com/photo-1504473307692-95f00fc261bc?w=300" },
            { id: 19, name: "دونات الماتشا اليابانية", price: 42, desc: "شاي ماتشا وشوكولاتة بيضاء.", img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=300" },
            { id: 20, name: "دونات الفيروز الملكية", price: 50, desc: "خلطة فاخرة مع اللؤلؤ الذهبي.", img: "https://images.unsplash.com/photo-1525059696034-4967a8e1dca2?w=300" }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if(!grid) return;
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-img-container">
                        <img src="${p.img}" alt="${p.name}">
                    </div>
                    <div class="product-info">
                        <h4 class="product-title">${p.name}</h4>
                        <p class="product-desc">${p.desc}</p>
                    </div>
                    <div class="product-footer">
                        <span class="product-price">${p.price} ج.م</span>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">+ إضافة</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if(item) { item.qty++; } else { cart.push({...product, qty: 1}); }
            updateCart();
            toggleCart(true);
        }

        function updateCart() {
            document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.qty, 0);
            const container = document.getElementById('cartItemsContainer');
            if(cart.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 30px;">السلة فارغة حالياً</p>`;
                document.getElementById('cartTotalPrice').innerText = "0 ج.م";
                return;
            }
            let total = 0;
            container.innerHTML = cart.map(i => {
                total += i.price * i.qty;
                return `
                    <div class="cart-item">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">${i.name}</div>
                            <div style="font-size:11px; color:var(--accent-gold);">${i.price} ج.م × ${i.qty}</div>
                        </div>
                        <div>
                            <button onclick="changeQty(${i.id}, -1)" style="padding:2px 8px;">-</button>
                            <span style="margin:0 5px;">${i.qty}</span>
                            <button onclick="changeQty(${i.id}, 1)" style="padding:2px 8px;">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotalPrice').innerText = total + " ج.م";
        }

        function changeQty(id, d) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.qty += d;
                if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCart();
        }

        function toggleCart(forceOpen = false) {
            const drawer = document.getElementById('cartDrawer');
            if(forceOpen) drawer.classList.add('open');
            else drawer.classList.toggle('open');
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
            if(id === 'accountModal') loadUserData();
            if(id === 'ordersModal') loadOrders();
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function saveUserData() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const address = document.getElementById('userAddress').value;
            if(!name || !phone) { alert('يرجى إدخال الاسم ورقم الهاتف'); return; }
            localStorage.setItem('user', JSON.stringify({name, phone, address}));
            alert('تم حفظ البيانات بنجاح!');
            closeModal('accountModal');
        }

        function loadUserData() {
            const u = JSON.parse(localStorage.getItem('user') || '{}');
            if(u.name) document.getElementById('userName').value = u.name;
            if(u.phone) document.getElementById('userPhone').value = u.phone;
            if(u.address) document.getElementById('userAddress').value = u.address;
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return alert('السلة فارغة!');
